<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apostila — protótipo de navegação</title>
<style>
  :root{ --bg:#15171c; --panel:#1d2026; --line:#2e3340; --fg:#e7e9ee; --mut:#8a93a3; --acc:#5b9cff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,Segoe UI,Arial}
  body{display:flex;flex-direction:column}
  #top{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  #top b{font-size:15px} #crumb{color:var(--mut);font-size:13px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  #crumb .c{color:#cdd5e2;cursor:pointer;padding:1px 4px;border-radius:4px} #crumb .c:hover{background:#2a2f3a;color:#fff}
  #crumb .sep{color:#4a5161}
  #main{display:flex;flex:1;min-height:0}
  #side{width:430px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:#181b21}
  #search{margin:10px;padding:8px 11px;background:#23272f;border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit}
  #tree{flex:1;overflow:auto;padding:4px 6px 40px}
  .row{display:flex;align-items:center;gap:5px;padding:3px 6px;border-radius:6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row:hover{background:#23262e}
  .row.sel{background:#1c3a63;outline:1px solid #2f5b9e}
  .tog{width:14px;color:var(--mut);flex:none;font-size:10px;transition:transform .1s}
  .tog.open{transform:rotate(90deg)}
  .mk{font-variant-numeric:tabular-nums;flex:none;font-weight:700}
  .lab{overflow:hidden;text-overflow:ellipsis}
  .pg{margin-left:auto;color:#5a6675;font-size:11px;flex:none;padding-left:8px}
  .kids.collapsed{display:none}
  /* cores por nível */
  .n-capitulo .mk,.n-capitulo .lab{color:#f0c24b} .n-capitulo{font-weight:700}
  .n-item .mk,.n-item .lab{color:#fff;font-weight:700}
  .n-parte .mk{color:#8ab4ff} .n-numero .mk{color:#79c0ff}
  .n-circulo .mk{color:#56d4c4} .n-romano .mk{color:#b79cff}
  .n-letra .mk{color:#e0a96d} .n-letra_min .mk{color:#9aa3b2}
  .lab{color:#c9d1dc} .n-numero .lab,.n-parte .lab{color:#e7e9ee}
  mark{background:#5b4b16;color:#ffe9a3;border-radius:3px}
  #detail{flex:1;overflow:auto;padding:30px 40px}
  #detail h1{margin:.2em 0;font-size:1.6em}
  #detail .meta{color:var(--mut);margin:6px 0 20px}
  #detail .badge{display:inline-block;background:#13283f;color:#7fb3ff;border:1px solid #27496e;border-radius:20px;padding:3px 11px;font-size:12px;margin-right:8px}
  #detail .hint{color:var(--mut);max-width:560px;margin-top:24px;border-left:3px solid var(--line);padding-left:14px}
  .pathline{color:var(--mut);font-size:13px;margin-bottom:8px}
  .navbar{display:flex;gap:12px;max-width:700px;margin:26px 0 6px;border-top:1px solid var(--line);padding-top:16px}
  .navb{flex:1 1 0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;transition:border-color .12s}
  .navb:hover{border-color:var(--acc)}
  .navb.next{text-align:right;align-items:flex-end}
  .navb .na{font-size:11px;color:var(--mut)}
  .navb .nt{font-size:13.5px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .navb-empty{flex:1 1 0}
  #syncToast{position:fixed;bottom:18px;right:18px;background:#163a2a;color:#7fe0a8;border:1px solid #2c6b4a;border-radius:8px;padding:8px 14px;font-size:13px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:9999}
  #syncToast.show{opacity:1;transform:translateY(0)}
  body.light #syncToast{background:#e3f6ea;color:#1c7a47;border-color:#abdcc0}
  /* ----- ensinamento ----- */
  .ens-subtitulo{color:#cdd5e2;font-size:15.5px;font-style:italic;text-align:center;margin:2px 0 22px;letter-spacing:.02em;max-width:700px}
  .pg-sub{max-width:700px;margin:34px 0 6px;font-size:1.18em;font-weight:700;color:#eef1f6;border-top:1px solid var(--line);padding-top:24px}
  .pg-sub:first-of-type{border-top:none;padding-top:4px;margin-top:10px}
  .pg-sub .pg-mk{font-variant-numeric:tabular-nums;margin-right:5px}
  .pg-sub.n-circulo .pg-mk{color:#56d4c4} .pg-sub.n-numero .pg-mk{color:#79c0ff}
  .pg-sub.n-romano .pg-mk{color:#b79cff} .pg-sub.n-letra .pg-mk{color:#e0a96d} .pg-sub.n-letra_min .pg-mk{color:#9aa3b2}
  .ens-fonte{color:var(--mut);font-size:13px;margin:4px 0 18px}
  .ens-texto{font-size:16.5px;line-height:1.9;color:#eef1f6;max-width:700px}
  .ens-data{color:var(--mut);font-size:13px;font-style:italic;margin:10px 0 6px;max-width:700px}
  details.ens-pre,details.ens-exp{max-width:700px;margin:14px 0;border-radius:9px;overflow:hidden}
  details.ens-pre{background:#191c23;border:1px solid var(--line)}
  details.ens-exp{background:#16201a;border:1px solid #294434}
  .ens-pre>summary,.ens-exp>summary{cursor:pointer;padding:9px 14px;font-size:13px;font-weight:600;user-select:none;list-style:none}
  .ens-pre>summary{color:#aeb8c6} .ens-exp>summary{color:#7fd79b}
  summary::-webkit-details-marker{display:none}
  .ens-pre>summary:hover,.ens-exp>summary:hover{filter:brightness(1.25)}
  .db-body{padding:2px 16px 14px;font-size:14.5px;line-height:1.75}
  .ens-pre .db-body{color:#dbe2ec;font-style:italic} .ens-exp .db-body{color:#c7d2dd}
  details.ens-resumo,details.ens-anexo{max-width:700px;margin:14px 0;border-radius:9px;overflow:hidden}
  details.ens-resumo{background:#1c1a23;border:1px solid #34304a}
  details.ens-anexo{background:#1a1c20;border:1px solid var(--line)}
  .ens-resumo>summary,.ens-anexo>summary{cursor:pointer;padding:9px 14px;font-size:13px;font-weight:600;user-select:none;list-style:none}
  .ens-resumo>summary{color:#b79cff} .ens-anexo>summary{color:#8a93a3}
  .ens-resumo>summary:hover,.ens-anexo>summary:hover{filter:brightness(1.25)}
  .ens-resumo .db-body{color:#c2b8dd;font-style:italic} .ens-anexo .db-body{color:#aab3c0}
  .ens-anexo .ax-sub{font-weight:700;font-size:1.05em;margin:18px 0 4px;color:var(--fg);padding-bottom:2px;border-bottom:1px solid var(--line)}
  .ens-anexo .ax-sub:first-child{margin-top:4px}
  .ens-anexo .ax-salmo-h{color:#b79cff;border-bottom-color:rgba(183,156,255,.25)}
  .ens-anexo .ax-fonte{color:var(--mut);font-size:12px;margin:2px 0 8px}
  details.ax-pre{max-width:100%;margin:7px 0 10px;border-radius:8px;overflow:hidden;background:#1a1e27;border:1px solid var(--line)}
  .ax-pre>summary{cursor:pointer;padding:7px 13px;font-size:12.5px;font-weight:600;color:#8a97ad;user-select:none;list-style:none}
  .ax-pre>summary::-webkit-details-marker{display:none}
  .ax-pre>summary:hover{filter:brightness(1.2)}
  .ax-pre-body{padding:2px 14px 12px}
  .ax-pre-p{font-size:14px;line-height:1.75;color:#c8d0dc;font-style:italic;margin:5px 0}
  .ens-anexo .ax-verse{font-style:italic;line-height:1.9;color:#d8dfe8;margin:2px 0;padding-left:20px;border-left:2px solid rgba(183,156,255,.3)}
  .ens-anexo .ax-verse-date{font-style:italic;font-size:12px;color:var(--mut);padding-left:20px;margin:4px 0 8px}
  .ens-anexo .ax-text{margin:5px 0;font-size:14px;line-height:1.7}
  body.light details.ax-pre{background:#eeecea;border-color:#d5d1c9}
  body.light .ax-pre>summary{color:#636b78}
  body.light .ax-pre-p{color:#3a3f48}
  body.light .ens-anexo .ax-verse{color:#2a2f40;border-left-color:rgba(100,80,200,.22)}
  body.light .ens-anexo .ax-verse-date{color:#7a8090}
  body.light .ens-anexo .ax-salmo-h{color:#6d50b0}
  .ens-texto.ens-verso{white-space:pre-line;font-style:italic;text-align:center;line-height:1.85;color:#dfe6f0}
  .ens-salmo-main{max-width:700px;margin:14px 0}   /* salmo de texto principal: verso via estilos ax-* */
  .ens-refs{max-width:700px;margin:14px 0;padding:8px 14px;border-left:3px solid #3a4252;background:#16181d;border-radius:0 8px 8px 0}
  .ens-refs-h{color:var(--mut);font-size:12.5px;font-weight:700;margin-bottom:4px}
  .ens-ref{color:#c2cad6;font-size:13.5px;margin:3px 0}
  .ens-jp-flag{color:#e0a96d;font-size:12.5px;margin:8px 0;max-width:700px}
  sup.fn{position:relative;display:inline-flex;align-items:center;gap:2px;vertical-align:super;font-size:10px;line-height:1;
         font-weight:700;color:#fff;background:#2f6fed;padding:2px 6px 2px 4px;border-radius:9px;
         cursor:pointer;margin:0 2px;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:background .12s}
  sup.fn::before{content:"📝";font-size:9px}
  sup.fn:hover{background:#4f88ff}
  sup.fn .fn-pop{display:none;position:fixed;z-index:120;left:0;top:0;
         width:max-content;max-width:320px;white-space:normal;text-align:left;font-style:normal;font-weight:400;
         font-size:13.5px;line-height:1.55;letter-spacing:normal;color:#eef1f6;background:#0f1217;
         border:1px solid #3d4656;border-radius:9px;padding:9px 12px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
  .nspan{border-radius:3px;transition:background .15s,box-shadow .15s;cursor:help}
  .nspan.hl,.nspan:hover{background:rgba(79,136,255,.30);box-shadow:0 0 0 1px rgba(79,136,255,.30)}
  sup.ref{font-size:9px;vertical-align:super;color:#74808f;cursor:help;margin:0 1px;opacity:.7;transition:opacity .12s,color .12s}
  sup.ref:hover{opacity:1;color:#9fb0c8}
  #themeBtn{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:3px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
  #themeBtn:hover{border-color:var(--acc)}
  #grifoBtn{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:3px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
  #grifoBtn.on{background:#2f6fed;border-color:#2f6fed;color:#fff}
  body.grifo-edit .ens-texto,body.grifo-edit .db-body{outline:1px dashed rgba(79,136,255,.30);outline-offset:4px;border-radius:5px}
  #grifoMenu,#axMenu{position:fixed;z-index:200;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:0 12px 34px rgba(0,0,0,.5);display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:300px}
  #grifoMenu .gm-h,#axMenu .gm-h{font-size:12px;color:var(--mut);width:100%;margin-bottom:1px}
  #grifoMenu button,#axMenu button{background:#2f6fed;color:#fff;border:none;border-radius:7px;padding:4px 10px;cursor:pointer;font-size:13px}
  #grifoMenu button:hover,#axMenu button:hover{background:#4f88ff}
  body.grifo-edit .ens-anexo [data-axraw]{cursor:pointer;border-radius:4px;transition:background .12s}
  body.grifo-edit .ens-anexo [data-axraw]:hover{background:rgba(79,136,255,.12)}
  #grifoMenu .gm-add{background:#1f9d57} #grifoMenu .gm-add:hover{background:#27b568}
  #noteEditor{position:fixed;z-index:210;width:380px;max-width:92vw;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 13px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
  #noteEditor .ne-h{font-size:13px;font-weight:700;color:var(--fg);margin-bottom:7px}
  #noteEditor .ne-ta{width:100%;min-height:120px;resize:vertical;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:14px/1.5 system-ui,Segoe UI,Arial}
  #noteEditor .ne-row{display:flex;align-items:center;gap:8px;margin-top:8px}
  #noteEditor .ne-save{background:#2f6fed;color:#fff;border:none;border-radius:7px;padding:5px 12px;cursor:pointer;font-size:13px}
  #noteEditor .ne-save:hover{background:#4f88ff}
  #noteEditor .ne-cancel{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:13px}
  #noteEditor .ne-msg{font-size:12px;color:var(--mut)}
  #noteEditor .ne-hint{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.4}
  #noteEditor .ne-grifo{margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}
  #noteEditor .ne-glabel{font-size:12px;color:var(--mut);margin-bottom:5px}
  #noteEditor .ne-glabel b{color:var(--fg);font-weight:600}
  #noteEditor .ne-sel{font-size:11.5px;color:var(--mut);margin-bottom:6px;min-height:15px}
  #noteEditor .ne-guse{background:#2f6fed;color:#fff;border:none;border-radius:7px;padding:5px 11px;cursor:pointer;font-size:12.5px}
  #noteEditor .ne-guse:disabled{background:#3a4150;cursor:default;opacity:.55}
  #noteEditor .ne-gclear{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12.5px}
  /* ----- marcador cru de nota (\*N ainda sem nota) + painel de revisão ----- */
  sup.rawmk{font-size:10px;vertical-align:super;color:#e0a96d;border:1px dashed rgba(224,169,109,.55);border-radius:7px;padding:0 4px;margin:0 1px;cursor:default}
  body.review sup.rawmk{cursor:pointer}
  sup.rawmk.cur{background:#e0a96d;color:#1b1406;border-style:solid;animation:rkpulse 1.2s ease-in-out 2}
  @keyframes rkpulse{50%{box-shadow:0 0 0 5px rgba(224,169,109,.35)}}
  .ghost{background:rgba(224,169,109,.22);box-shadow:0 0 0 1px rgba(224,169,109,.45);border-radius:3px}
  #revBtn{background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:3px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
  #revBtn.on{background:#b5701f;border-color:#b5701f;color:#fff}
  #review{display:none;width:400px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 14px 30px;font-size:13.5px}
  body.review #review{display:block}
  #review h3{margin:2px 0 8px;font-size:14px}
  #review .rv-filters{display:flex;gap:6px;margin-bottom:8px}
  #review select,#review input,#review textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:inherit}
  #review select{flex:1;min-width:0}
  #review .rv-prog{font-size:12px;color:var(--mut);margin:4px 0 10px;line-height:1.5}
  #review .rv-bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:3px 0 8px}
  #review .rv-bar i{display:block;height:100%;background:#1f9d57}
  #review .rv-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
  #review .rv-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  #review .rv-tag{font-size:11px;border-radius:10px;padding:1px 8px;border:1px solid var(--line);color:var(--mut)}
  #review .st-pendente{color:#7fb3ff;border-color:#27496e} #review .st-sem-fonte{color:#e0a96d;border-color:#6b4d2c}
  #review .st-aprovada{color:#7fe0a8;border-color:#2c6b4a} #review .st-rejeitada,#review .st-descartada{color:#ff9b9b;border-color:#6b2c2c}
  #review .rv-node{color:var(--acc);cursor:pointer;font-weight:600;margin:4px 0 6px;display:block}
  #review .rv-ctx{font-size:13px;line-height:1.6;color:var(--mut);background:var(--panel);border-radius:7px;padding:6px 9px;margin-bottom:8px}
  #review .rv-ctx b{color:#e0a96d}
  #review label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
  #review .rv-trow{display:flex;gap:6px} #review .rv-trow input{flex:1;min-width:0}
  #review textarea{width:100%;min-height:110px;resize:vertical;line-height:1.5}
  #review .rv-src{font-size:11.5px;color:var(--mut);margin-top:4px}
  #review .rv-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  #review button{border:none;border-radius:7px;padding:6px 11px;cursor:pointer;font-size:13px;background:#3a4150;color:#fff}
  #review button:hover{filter:brightness(1.15)}
  #review .b-ok{background:#1f9d57} #review .b-rej{background:#8a3a3a} #review .b-drop{background:#6b4d2c} #review .b-sel{background:#2f6fed;padding:5px 9px}
  #review .rv-nav{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px;color:var(--mut);font-size:12px}
  #review .rv-msg{min-height:18px;font-size:12.5px;margin-top:8px}
  #review .rv-msg.err{color:#ff9b9b} #review .rv-msg.ok{color:#7fe0a8}
  #review .rv-keys{font-size:11px;color:var(--mut);margin-top:12px;line-height:1.6}
  #review kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:10.5px}
  body.light sup.rawmk{color:#9a5a12;border-color:rgba(154,90,18,.45)}
  /* ----- busca no texto completo ----- */
  #results{flex:1;overflow:auto;padding:0 8px 40px;display:none}
  body.searching #results{display:block} body.searching #tree{display:none}
  .rs-h{font-size:12px;color:var(--mut);margin:6px 4px 8px}
  .rs{padding:7px 9px;border-radius:7px;cursor:pointer;border:1px solid transparent}
  .rs:hover{background:#23262e;border-color:var(--line)}
  .rs-t{font-weight:600;font-size:13px;color:var(--fg)} .rs-t .mk{margin-right:4px}
  .rs-p{font-size:11.5px;color:var(--mut)}
  .rs-s{font-size:12.5px;color:#aab3c0;line-height:1.5;margin-top:2px}
  body.light .rs:hover{background:#eceae3} body.light .rs-s{color:#4a515c}
  img.ens-img{display:block;max-width:100%;margin:14px auto;border-radius:6px;background:#fff;padding:6px}
  /* ----- referência cruzada clicável (Livro pág. N) ----- */
  a.xref{color:var(--acc);text-decoration:none;border-bottom:1px dotted var(--acc);white-space:nowrap;font-size:.92em}
  a.xref:hover{border-bottom-style:solid}
  sup.fn .fn-pop a.xref{font-size:1em}
  #copyLink{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:20px;padding:2px 10px;font-size:12px;cursor:pointer;margin-left:4px}
  #copyLink:hover{color:var(--fg);border-color:var(--acc)}
  /* ----- site público (estático): sem ferramentas de edição ----- */
  body.static #grifoBtn,body.static #revBtn,body.static sup.rawmk,body.static .only-local{display:none!important}
  /* ----- celular ----- */
  #menuBtn{display:none;background:transparent;border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:3px 10px;font-size:15px;cursor:pointer}
  @media (max-width: 820px){
    #top{flex-wrap:wrap;gap:8px;padding:8px 12px}
    #top b{font-size:14px}
    #crumb{order:5;width:100%;font-size:12px;overflow-x:auto;flex-wrap:nowrap;white-space:nowrap}
    #menuBtn{display:inline-block}
    #side{position:fixed;z-index:300;top:0;bottom:0;left:0;width:88vw;max-width:400px;transform:translateX(-102%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.5)}
    body.drawer #side{transform:none}
    body.drawer::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:250}
    #detail{padding:18px 16px 60px}
    #detail h1{font-size:1.3em}
    .ens-texto{font-size:16px;line-height:1.8}
    .navbar{flex-direction:column}
    #review{display:none!important}
    sup.fn .fn-pop{max-width:88vw}
  }
  /* ===================== TEMA CLARO ===================== */
  body.light{ --bg:#f7f6f2; --panel:#fffefb; --line:#dcd8cf; --fg:#222630; --mut:#6a7280; --acc:#2f6fed; }
  body.light #side{background:#f0eee7}
  body.light #search{background:#fff}
  body.light #crumb .c{color:#2f4a73} body.light #crumb .c:hover{background:#e6ebf3;color:#16233a}
  body.light #crumb .sep{color:#aab0bd}
  body.light .row:hover{background:#eceae3}
  body.light .row.sel{background:#dce8f8;outline:1px solid #9cc0ef}
  body.light .pg{color:#9aa1ac}
  body.light .n-capitulo .mk,body.light .n-capitulo .lab{color:#a6791a}

<body>
<div id="top">
  <button id="menuBtn" title="Índice">☰</button>
  <b id="brand">📖 Apostila — navegação</b>
  <span id="crumb"></span>

</div>
<div id="main">
  <div id="side">
    <input id="search" type="search" placeholder="🔎 buscar no livro… (título e texto)">
    <div id="tree"></div>
    <div id="results"></div>
  </div>
  <div id="detail"><div class="hint">Selecione um item na árvore ou busque acima.<br>Os 9 níveis ficam sempre visíveis na trilha do topo — você não se perde.</div></div>
  <aside id="review"></aside>
</div>
<script>
const $=s=>document.querySelector(s);
// Site público: build_site.py injeta window.SD_STATIC=true → só leitura (sem servidor, sem edição).
const STATIC=!!window.SD_STATIC;
if(STATIC){ document.body.classList.add('static'); $('#brand').textContent='📖 Novo Manual de Difusão'; }
(function(){ const b=document.getElementById('themeBtn'); if(!b) return;
  function apply(t){ document.body.classList.toggle('light', t==='light'); b.textContent = t==='light' ? '🌙 Escuro' : '☀️ Claro'; }
  let t = localStorage.getItem('nav-theme') || 'dark'; apply(t);
  b.onclick = ()=>{ t = (t==='light'?'dark':'light'); localStorage.setItem('nav-theme', t); apply(t); };
})();
// nota 📝: hover grifa o trecho ligado + mostra o balão (position:fixed escapa o overflow das caixas; vira pra cima se não couber)
(function(){
  function span(fn){ const box=fn.closest('.ens-texto,.db-body,.ens-verso')||document; return box.querySelector('.nspan[data-fn="'+fn.dataset.fn+'"]'); }
  function showPop(fn){
    const pop=fn.querySelector('.fn-pop'); if(!pop) return;
    pop.style.display='block';
    const rc=fn.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight;
    let left=Math.max(8, Math.min(window.innerWidth-pw-8, rc.left+rc.width/2-pw/2));
    let top=rc.bottom+8; if(top+ph>window.innerHeight-8) top=Math.max(8, rc.top-ph-8);
    pop.style.left=left+'px'; pop.style.top=top+'px';
  }
  document.addEventListener('mouseover', e=>{ const fn=e.target.closest&&e.target.closest('sup.fn'); if(!fn||!fn.dataset.fn) return; const s=span(fn); if(s) s.classList.add('hl'); showPop(fn); });
  document.addEventListener('click', e=>{   // toque (celular): abre/fecha o balão da nota
    if(typeof GRIFO_EDIT!=='undefined' && GRIFO_EDIT) return;
    const fn=e.target.closest&&e.target.closest('sup.fn');
    document.querySelectorAll('sup.fn .fn-pop').forEach(p=>{ if(!fn||!fn.contains(p)) p.style.display='none'; });
    if(fn && !(e.target.closest('a'))){ const pop=fn.querySelector('.fn-pop'); if(pop && pop.style.display!=='block') showPop(fn); }
  });
  document.addEventListener('mouseout', e=>{ const fn=e.target.closest&&e.target.closest('sup.fn'); if(!fn||!fn.dataset.fn) return; if(e.relatedTarget&&fn.contains(e.relatedTarget)) return; const s=span(fn); if(s) s.classList.remove('hl'); const pop=fn.querySelector('.fn-pop'); if(pop) pop.style.display='none'; });
})();
let TREE=null, flat=[], cur=null;
$('#menuBtn').onclick=()=>document.body.classList.toggle('drawer');
document.addEventListener('click',e=>{ if(document.body.classList.contains('drawer') && !(e.target.closest('#side')||e.target.closest('#menuBtn'))) document.body.classList.remove('drawer'); });
const CIRC=n=>String.fromCharCode(0x2460+(+n-1));
function mkLabel(n){
  if(n.nivel==='circulo') return CIRC(n.marcador);
  if(n.nivel==='capitulo'||n.nivel==='item') return n.marcador;
  return n.marcador+'.';
}
function walk(n,parent,depth){ n._p=parent; n._d=depth; flat.push(n); (n.children||[]).forEach(c=>walk(c,n,depth+1)); }

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Token de citação/fonte (NÃO casa glosas como "(innen)", "(tane)", "(Revelação)").
const CIT_TOK=/(p[áa]g\.?|col\.|\bl\.\s|\bvol\b|se[çc]|linha|&lt;|&gt;|\bRon\b|\bShu\b|\bKyo\b|\bIshi\b|\bEi\b|\bChi\b|\bSui\b|\bKigo\b|Zenk[oôó]?u?|Zench[oôó]?|\bLivro\b|Hikari|Ronbet|\bSan\b|\bToko\b|Geisha|Shinken|\bK\d)/i;
// Referência a página do próprio livro → link para o ensinamento daquela página.
const PG_RE=/Livro,?\s*p[áa]g\.?\s*(\d+)|p[áa]g(?:ina)?\.?\s*(\d+)\s*(?:deste|desta)\s*(?:livro|obra)/gi;
let PAGED=null;   // [ [pagina, nó] ] em ordem de leitura (páginas crescentes)
function pageNode(pg){
  if(!PAGED) PAGED=flat.filter(n=>n.pagina).map(n=>[n.pagina,n]);
  const ex=PAGED.find(([p])=>p===pg); if(ex) return ex[1];          // começa exatamente nessa página
  let best=null; for(const [p,n] of PAGED){ if(p<pg) best=n; else break; } return best;   // senão: o último que começa antes
}
function xrefA(pg,label,title){ const n=pageNode(pg); if(!n) return null;
  return `<a class="xref" href="#${n.id}" title="${(title||('ir para a pág. '+pg)).replace(/"/g,'&quot;')}">${label}</a>`; }
// liga as referências de página que sobraram no texto (fora de tags)
function linkPages(html){
  return html.split(/(<[^>]*>)/).map((part,i)=> i%2 ? part :
    part.replace(PG_RE,(mm,a,b)=> xrefA(+(a||b), mm) || mm)).join('');
}
// Citação inline entre parênteses → chip 📖 (referência no hover). Glosa fica inline.
// Se a citação aponta para uma página deste livro, vira link "📖 pág. N" (clicável).
function refChips(html){
  return html.replace(/\(([^()]{2,300})\)/g,(mm,inner)=>{
    if(!CIT_TOK.test(inner)) return mm;
    const links=[...inner.matchAll(PG_RE)].map(m=>xrefA(+(m[1]||m[2]),'📖 pág. '+(m[1]||m[2]),inner)).filter(Boolean);
    return links.length ? '('+links.join(', ')+')' : `<sup class="ref" title="${inner.replace(/"/g,'&quot;')}">📖</sup>`;
  });
}
// Marcador cru de OCR ainda sem nota: "\*3"/"*3" ou dígito colado ("boca2.", "Isso6 é").
// Só troca em TEXTO (fora de tags/atributos) → chip <sup.rawmk>.
function rawMarks(html){
  const mk=(n,shown)=>`<sup class="rawmk" data-rn="${n}" title="nota ${n} ainda não inserida">${shown}</sup>`;
  return html.split(/(<[^>]*>)/).map((part,i)=> i%2 ? part : part
    .replace(/(?<![*\\])\*(\d{1,2})(?![\d*])/g,(_,n)=>mk(n,'*'+n))
    .replace(/([a-zà-ÿ]{2}|[a-zà-ÿ][)"”»])(\d{1,2})(?![\d*])(?=[\s.,;:!?)"”»\]]|$)/g,(_,w,n)=>w+mk(n,n))
  ).join('');
}
function renderNotas(text, notas){
  const m={}; (notas||[]).forEach(x=>m[x.n]={t:x.texto,id:x.id||''});
  let s=refChips(esc(text||''));                       // 1) citações inline viram chip 📖
  const chip=(n)=>{const o=m[n]||{};return `<sup class="fn" data-fn="${n}" data-id="${o.id||''}" tabindex="0">${n}<span class="fn-pop">${linkPages(esc(o.t||''))}</span></sup>`;};
  s=linkPages(s);                                      // 1b) "pág. N deste livro" solto no texto → link
  s=s.replace(/!\[[^\]]*\]\[(image\d+)\]/g,(mm,id)=>{ const src=(TREE&&TREE.imagens||{})[id];   // 1c) imagem embutida (trecho do original)
    return src?`<img class="ens-img" src="${src}" alt="imagem do original (${id})" loading="lazy">`:mm; });
  s=s.replace(/==(.+?)==([^\[]*?)\[\^(\d+)\]/g,(_,p,mid,n)=>`<span class="nspan" data-fn="${n}">${p}</span>${mid}${chip(n)}`); // 2) trecho citado grifável + nota
  s=s.replace(/\[\^(\d+)\]/g,(_,n)=>chip(n));           // 3) notas soltas
  s=rawMarks(s);   // 4) marcador cru de OCR (*3 ou dígito colado boca2.) = nota pendente
  return s.replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');   // 3) parágrafos
}
// Título com nota: [^N] vira chip 📝 (a nota pode estar ancorada no título). Sem refChips/parágrafos.
function renderTitle(title, notas){
  const m={}; (notas||[]).forEach(x=>m[x.n]={t:x.texto,id:x.id||''});
  const chip=(n)=>{const o=m[n]||{};return `<sup class="fn" data-fn="${n}" data-id="${o.id||''}" tabindex="0">${n}<span class="fn-pop">${esc(o.t||'')}</span></sup>`;};
  let s=esc(title||'').replace(/==/g,'');   // título não usa grifo explícito — o título inteiro é o trecho
  s=s.replace(/^(.+?)\s*\[\^(\d+)\]\s*$/,(_,pre,n)=>`<span class="nspan" data-fn="${n}">${pre}</span>${chip(n)}`); // [^N] no fim → o título inteiro é o trecho da nota (grifa no hover)
  s=s.replace(/\[\^(\d+)\]/g,(_,n)=>chip(n));   // [^N] restantes (no meio) → só chip
  s=rawMarks(s);
  return s;
}
// Anexo com NÍVEIS: segmenta sub-itens, [Rótulos]→bloco recolhível, salmo→verso. Marca {{tipo}} do usuário tem prioridade.
function renderAnexoBody(text, notas, salmoDefault){
  const lines=(text||'').split('\n');
  const segs=[]; let curSalmo=!!salmoDefault, preOpen=false, preLabel='', preBuf=[];
  function flushPre(){
    if(!preOpen) return;
    const body=preBuf.map(l=>`<p class="ax-pre-p" data-axraw="${esc(l)}">${renderNotas(l.replace(/^\{\{\w+\}\}\s*/,''),notas)}</p>`).join('');
    segs.push({t:'pre',label:preLabel,body}); preOpen=false; preLabel=''; preBuf=[];
  }
  function pushVerse(c,raw){   // separa a data colada no fim do verso → verso + verso-data
    const dm=c.match(/^(.+?)\s*(\([^)]*\d{4}\)(?:\s*\([^)]*\))*)\s*$/);
    if(dm && dm[1].trim().length>6){ segs.push({t:'verse',text:dm[1].trim(),raw}); segs.push({t:'verse-date',text:dm[2].trim()}); curSalmo=false; }
    else segs.push({t:'verse',text:c,raw});
  }
  for(const raw of lines){
    const ln=raw.trim(); if(!ln) continue;
    const tg=ln.match(/^\{\{(\w+)\}\}\s*/); const forced=tg?tg[1]:null; const c=tg?ln.slice(tg[0].length):ln;
    if(forced==='salmo'){ flushPre(); curSalmo=true; pushVerse(c,ln); continue; }
    if(forced==='data'){ flushPre(); segs.push({t:'verse-date',text:c,raw:ln}); continue; }
    if(forced==='texto'){ flushPre(); curSalmo=false; segs.push({t:'text',text:c,raw:ln}); continue; }
    if(forced==='fonte'){ flushPre(); segs.push({t:'fonte',text:c,raw:ln}); continue; }
    if(forced==='sub'){ flushPre(); curSalmo=/salmo|御詠|gyoei/i.test(c); segs.push({t:'sub',n:'',title:c,isSalmo:curSalmo,raw:ln}); continue; }
    const sm=c.match(/^(\d+)\.?\s+(.{3,70})$/);
    if(sm && /^[A-ZÀ-Ý"「(]/.test(sm[2]) && !/[.!?;,]$/.test(sm[2])){
      flushPre(); curSalmo=/salmo|御詠|gyoei/i.test(sm[2]);
      segs.push({t:'sub',n:sm[1],title:sm[2],isSalmo:curSalmo,raw:ln}); continue;
    }
    const lm=c.match(/^\[(.+)\]$/);
    if(lm){ flushPre(); preOpen=true; preLabel=lm[1]; preBuf=[]; continue; }
    if(!curSalmo && /^\(/.test(c) && /\)$/.test(c) && CIT_TOK.test(c)){ flushPre(); segs.push({t:'fonte',text:c,raw:ln}); continue; }
    if(preOpen){ preBuf.push(ln); continue; }
    if(curSalmo){
      if(/^\([^)]*\d{4}\)/.test(c)){ segs.push({t:'verse-date',text:c,raw:ln}); curSalmo=false; }
      else pushVerse(c,ln);
      continue;
    }
    segs.push({t:'text',text:c,raw:ln});
  }
  flushPre();
  const da=(s)=> s.raw ? ` data-axraw="${esc(s.raw)}"` : '';
  return segs.map(s=>{
    if(s.t==='sub')      return `<div class="ax-sub${s.isSalmo?' ax-salmo-h':''}"${da(s)}>${s.n?s.n+'. ':''}${renderNotas(s.title,notas)}</div>`;
    if(s.t==='fonte')    return `<div class="ax-fonte"${da(s)}>📜 ${esc(s.text.replace(/^\((.*)\)$/,'$1'))}</div>`;
    if(s.t==='pre')      return `<details class="ax-pre" open><summary>▸ ${esc(s.label)}</summary><div class="ax-pre-body">${s.body}</div></details>`;
    if(s.t==='verse')    return `<div class="ax-verse"${da(s)}>${renderNotas(s.text,notas)}</div>`;
    if(s.t==='verse-date') return `<div class="ax-verse-date"${da(s)}>${renderNotas(s.text,notas)}</div>`;
    return `<div class="ax-text"${da(s)}>${renderNotas(s.text,notas)}</div>`;
  }).join('');
}
function closeAxMenu(){ const e=document.getElementById('axMenu'); if(e) e.remove(); }
function openAxTagMenu(block){
  closeAxMenu(); const file=mdFileOf(cur&&cur.id), raw=block.dataset.axraw;
  if(!file||raw==null) return;
  const mn=document.createElement('div'); mn.id='axMenu';
  mn.innerHTML='<div class="gm-h">Marcar bloco como:</div>';
  [['salmo','🎴 Poema'],['data','🗓 Data'],['texto','¶ Texto'],['fonte','📜 Fonte'],['sub','▪ Subtítulo'],['auto','✕ auto']].forEach(([t,lbl])=>{
    const b=document.createElement('button'); b.textContent=lbl;
    b.onclick=async()=>{ closeAxMenu();
      try{ const r=await fetch('/api/anexotag',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:file,catchword:raw,tag:t})});
        const j=await r.json(); if(!j.ok){ alert('Não deu: '+(j.msg||j.error||'?')); return; }
        bumpRev(file); await reloadBook(cur&&cur.id);
      }catch(err){ alert('Erro: '+err); } };
    mn.appendChild(b);
  });
  document.body.appendChild(mn);
  const rc=block.getBoundingClientRect();
  mn.style.left=Math.max(8,Math.min(window.innerWidth-mn.offsetWidth-8,rc.left))+'px';
  mn.style.top=(rc.bottom+6)+'px';
}
function block(cls,sum,html){ return `<details class="${cls}" open><summary>${sum}</summary><div class="db-body">${html}</div></details>`; }
function renderEnsinamento(e){
  let h='';
  if(e.fonte) h+=`<div class="ens-fonte">📜 ${esc(e.fonte)}</div>`;
  if(e.preambulo) h+=block('ens-pre','▸ Contexto anterior — Trecho do Preâmbulo', renderNotas(e.preambulo,e.notas));
  if(e.texto){
    // salmo: cada linha vira verso/data/fonte (renderAnexoBody, salmoDefault=true).
    // wrapper .ens-anexo reaproveita estilos ax-*, hover e o menu de tag (🎴/🗓/📜) do anexo.
    if(e.tipo==='salmo') h+=`<div class="ens-anexo ens-salmo-main">${renderAnexoBody(e.texto,e.notas,true)}</div>`;
    else h+=`<div class="ens-texto">${renderNotas(e.texto,e.notas)}</div>`;
  }
  if(e.data) h+=`<div class="ens-data">— ${esc(e.data)}</div>`;
  if(e.posfacio) h+=block('ens-pre','▸ Trecho do Posfácio', renderNotas(e.posfacio,e.notas));
  if(e.resumo) h+=block('ens-resumo','Resumo', renderNotas(e.resumo,e.notas));
  if(Array.isArray(e.referencias)&&e.referencias.length)
    h+=`<div class="ens-refs">`+e.referencias.map((r,i)=>(i===0&&/:\s*$/.test(r))?`<div class="ens-refs-h">${esc(r)}</div>`:`<div class="ens-ref">${esc(r)}</div>`).join('')+`</div>`;
  if(e.explicacao) h+=block('ens-exp','解説 · Comentário do editor — Explicação', renderNotas(e.explicacao,e.notas));
  if(Array.isArray(e.anexo)&&e.anexo.length)
    h+=e.anexo.map(a=>block('ens-anexo','➕ '+esc(a.titulo||'Anexo'), renderAnexoBody(a.texto,e.notas))).join('');
  if(e.tipo==='jp-pendente') h+=`<div class="ens-jp-flag">⚠ trecho em japonês — tradução pendente</div>`;
  return h;
}
function ownContent(n){ return !!(n.ensinamento || n.explicacao || n.subtitulo); }
function hasContentDesc(n){ return (n.children||[]).some(c=>ownContent(c)||hasContentDesc(c)); }
function expBlock(txt){ return block('ens-exp','解説 · Comentário do editor — Explicação', renderNotas(txt,[])); }
// Renderiza um filho dentro de uma página agrupada: subtítulo de seção + conteúdo,
// descendo recursivamente se o filho também for container puro.
function renderChild(c, depth){
  const tag='h'+Math.min(2+depth,5);
  let h=`<${tag} class="pg-sub n-${c.nivel}" id="anc-${c.id.replace(/\./g,'_')}"><span class="pg-mk">${mkLabel(c)}</span> ${renderTitle(c.title,(c.ensinamento||{}).notas)}</${tag}>`;
  if(c.subtitulo) h+=`<div class="ens-subtitulo">―― ${esc(c.subtitulo)} ――</div>`;
  if(c.ensinamento) h+=renderEnsinamento(c.ensinamento);
  else if(c.explicacao) h+=expBlock(c.explicacao);
  if(!c.ensinamento) (c.children||[]).forEach(g=>{ if(ownContent(g)||hasContentDesc(g)) h+=renderChild(g,depth+1); });
  return h;
}
// Página de um nó: folha → ensinamento; nó com intro → subtítulo+explicação;
// CONTAINER PURO (sem conteúdo próprio) → agrupa os filhos com conteúdo, roláveis.
function renderPage(n){
  if(n.ensinamento) return renderEnsinamento(n.ensinamento);
  let h='';
  if(n.subtitulo) h+=`<div class="ens-subtitulo">―― ${esc(n.subtitulo)} ――</div>`;
  if(n.explicacao) h+=expBlock(n.explicacao);
  if(!n.subtitulo && !n.explicacao && (n.children||[]).some(c=>ownContent(c)||hasContentDesc(c)))
    (n.children||[]).forEach(c=>{ if(ownContent(c)||hasContentDesc(c)) h+=renderChild(c,1); });
  return h || `<div class="hint">Aqui entraria o <b>ensinamento</b> — ligado ao scan da pág. ${n.pagina||'?'}.</div>`;
}
// Navegação sequencial pelo CONTEÚDO (intros de capítulo/item + ensinamentos), em ordem.
function navLabel(n){ return (mkLabel(n)+' '+(n.title||'').replace(/\[\^\d+\]|\*\d{1,2}(?!\d)/g,'')).trim().slice(0,46); }
function navTargets(n){
  const L=flat.filter(ownContent); let p=null,nx=null, i=L.indexOf(n);
  if(i>=0){ p=L[i-1]||null; nx=L[i+1]||null; }
  else { const fi=flat.indexOf(n); L.forEach(x=>{ if(flat.indexOf(x)<fi) p=x; }); nx=L.find(x=>flat.indexOf(x)>fi)||null; }
  return [p,nx];
}
function go(d){ const t=navTargets(cur)[d<0?0:1]; if(t) select(t); }
function navBar(n){

    const inT=multi?r.ft.includes(qf):words.every(w=>r.ft.includes(w));
    const all=words.every(w=>r.ft.includes(w)||r.fb.includes(w));
    if(!ph && !inT && !all) continue;
    const cnt=words.reduce((t,w)=>t+Math.min(countOf(r.fb,w),20),0);
    res.push({r, ph, score:(inT?100000:0)+ph*500+cnt});
  }

  const shown=res.slice(0,150);

    shown.map(({r,ph},k)=>{

      if(i>=0){ const a=Math.max(0,i-70), b=Math.min(r.body.length,i+110); snip=(a?'…':'')+markWords(r.body.slice(a,b),terms)+(b<r.body.length?'…':''); }

    }).join('');

    rows+=`<div>${f.replace('ShinDendo_','').replace('.md','')} — ${done}/${t} · <span title="com texto proposto">${d.pendente||0} propostas</span> · ${d['sem-fonte']||0} sem fonte</div>`; });
  const pc=tot.t?Math.round(100*tot.a/tot.t):0;
  return `<div class="rv-prog"><b>${tot.a}/${tot.t}</b> vagas resolvidas (${pc}%)<div class="rv-bar"><i style="width:${pc}%"></i></div>${rows}</div>`;
}
function rvCur(){ const L=rvList(); return L[RV.i]||null; }
function rvRender(msg,cls){
  const box=$('#review'); if(!box) return;
  const L=rvList(); if(RV.i>=L.length) RV.i=L.length-1; if(RV.i<0&&L.length) RV.i=0;
  const p=L[RV.i];
  const files=Object.keys(RV.summary).sort();
  let h=`<h3>📝 Revisão de notas</h3>
   <div class="rv-filters"><select id="rvFile"><option value="">todos os arquivos</option>${files.map(f=>`<option ${f===RV.file?'selected':''} value="${f}">${f.replace('ShinDendo_','').replace('.md','')}</option>`).join('')}</select>
   <select id="rvSt">${[['abertas','abertas'],['pendente','com proposta'],['sem-fonte','sem fonte'],['aprovada','aprovadas'],['rejeitada','rejeitadas'],['descartada','descartadas'],['todas','todas']].map(([v,l])=>`<option value="${v}" ${v===RV.st?'selected':''}>${l}</option>`).join('')}</select></div>`
   + rvProg();
  if(!p){ h+=`<div class="rv-card">Nada nesta lista. 🎉</div>`; box.innerHTML=h; rvBind(); return; }
  const nd=flat.find(n=>n.id===p.node);
  const nodeLbl=nd?((nd.nivel==='circulo'?CIRC(nd.marcador):nd.marcador)+' '+(nd.title||'').replace(/\[\^\d+\]|\*\d{1,2}/g,'')).slice(0,70):p.node;
  const conf=p.confianca!=null?` · confiança ${Math.round(p.confianca*100)}%`:'';
  const ro=p.status==='aprovada';
  h+=`<div class="rv-nav"><button id="rvPrev">◀</button><span>${RV.i+1} de ${L.length}</span><button id="rvNext">▶</button></div>
  <div class="rv-card">
   <div class="rv-h"><b>nota *${p.n}</b><span class="rv-tag st-${p.status}">${RV_ST[p.status]||p.status}</span>${p.origem?`<span class="rv-tag">${esc(p.origem)}</span>`:''}<span class="rv-tag">${p.id}</span></div>
   <a class="rv-node" id="rvGo">${esc(nodeLbl)}</a>
   <div class="rv-ctx">…${esc(p.ctx.slice(-110))}<b>*${p.n}</b>${esc(p.ctx_after||'')}…</div>
   <label>Trecho grifado (a frase que a nota explica)</label>
   <div class="rv-trow"><input id="rvTrecho" value="${esc(p.trecho||'').replace(/"/g,'&quot;')}" ${ro?'disabled':''}><button class="b-sel" id="rvSel" title="usar o texto selecionado no painel (M)">🖊 seleção</button></div>
   <label>Texto da nota</label>
   <textarea id="rvTexto" placeholder="${p.status==='sem-fonte'?'sem nota nas fontes digitais — digite (ou deixe para a leitura do scan)':''}" ${ro?'disabled':''}>${esc(p.texto||'')}</textarea>
   <div class="rv-src">${p.fonte_ref?('fonte: '+esc(p.fonte_ref)):''}${conf}${p.ref_id?(' · gravada como [^'+esc(p.ref_id)+']'):''}${p.obs?('<br>obs: '+esc(p.obs)):''}</div>
   <div class="rv-btns">${ro?'':`<button class="b-ok" id="rvOk">✓ Aprovar</button><button class="b-rej" id="rvRej">✗ Rejeitar</button><button class="b-drop" id="rvDrop" title="o *N é espúrio: some do texto, sem nota">🗑 Marcador espúrio</button><button id="rvSave">💾 Rascunho</button>`}${p.status==='rejeitada'?'<button id="rvReopen">↺ Reabrir</button>':''}</div>
   <div class="rv-msg ${cls||''}">${msg?esc(msg):''}</div>
  </div>
  <div class="rv-keys"><kbd>A</kbd> aprovar · <kbd>R</kbd> rejeitar · <kbd>D</kbd> espúrio · <kbd>M</kbd> usar seleção · <kbd>J</kbd>/<kbd>K</kbd> próxima/anterior · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> aprovar (no texto)</div>`;
  box.innerHTML=h; rvBind(); rvShow(p);
}
function rvBind(){
  const on=(id,f)=>{ const e=document.getElementById(id); if(e) e.onclick=f; };
  const fs=$('#rvFile'); if(fs) fs.onchange=e=>{ RV.file=e.target.value; RV.i=0; rvRender(); };
  const ss=$('#rvSt'); if(ss) ss.onchange=e=>{ RV.st=e.target.value; RV.i=0; rvRender(); };
  on('rvPrev',()=>rvStep(-1)); on('rvNext',()=>rvStep(1));
  on('rvGo',()=>{ const p=rvCur(); if(p) rvShow(p,true); });
  on('rvSel',rvUseSel); on('rvOk',rvApprove); on('rvRej',()=>rvAct('status',{status:'rejeitada'}));
  on('rvDrop',()=>{ if(confirm('Remover o marcador *'+rvCur().n+' do texto (sem criar nota)?')) rvAct('drop'); });
  on('rvSave',()=>rvAct('status',{},'rascunho salvo'));
  on('rvReopen',()=>rvAct('status',{status:'sem-fonte'}));
}
function rvStep(d){ const L=rvList(); if(!L.length) return; RV.i=Math.max(0,Math.min(L.length-1,RV.i+d)); rvRender(); }
function rvFields(){ return {texto:($('#rvTexto')||{}).value||'', trecho:($('#rvTrecho')||{}).value||''}; }
async function rvPost(body){
  const r=await fetch('/api/proposal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  return r.json();
}
async function rvAct(action,extra,okMsg){
  const p=rvCur(); if(!p) return;
  const body=Object.assign({id:p.id,action},rvFields(),extra||{});
  try{
    const j=await rvPost(body);
    if(!j.ok){ rvRender(j.msg||j.error||'erro','err'); return; }
    Object.assign(p,j.item);
    if(action==='approve'||action==='drop'){ bumpRev(p.file); await reloadBook(cur&&cur.id); }
    await rvLoad();
    if(okMsg){ rvRender(okMsg,'ok'); return; }
    rvRender();   // o item saiu da lista 'abertas' -> RV.i já aponta a próxima
  }catch(e){ rvRender('erro: '+e,'err'); }
}
async function rvApprove(){
  const f=rvFields();
  if(!f.texto.trim()){ rvRender('a nota está sem texto','err'); return; }
  await rvAct('approve',{},null);
}
function rvUseSel(){
  const t=(window.getSelection&&window.getSelection().toString()||'').replace(/\s+/g,' ').trim();
  if(!t){ rvRender('selecione o trecho no texto do ensinamento primeiro','err'); return; }
  const inp=$('#rvTrecho'); if(inp){ inp.value=t; rvGhost(rvCur()); }
}
// mostra a vaga no painel principal: seleciona o nó, acende o *N certo e o trecho proposto
function rvShow(p,force){
  if(!p) return;
  const nd=flat.find(n=>n.id===p.node); if(!nd) return;
  // se o nó está dentro da página agrupada atual (container), não troca de página
  const inPage=cur && (cur===nd || document.getElementById('anc-'+nd.id.replace(/\./g,'_')));
  if(force||!inPage) select(nd);
  requestAnimationFrame(()=>rvGhost(p,true));
}
function rvFindChip(p){
  const want=rvFold(p.ctx).slice(-24);
  let best=null, bs=-1;
  document.querySelectorAll('#detail sup.rawmk[data-rn="'+p.n+'"]').forEach(ch=>{
    const blk=ch.closest('.ens-texto,.db-body,.ax-text,.ax-verse,.ax-pre-p,h1,h2,h3,h4,h5')||ch.parentNode;
    const r=document.createRange(); r.setStart(blk,0); r.setEndBefore(ch);
    const got=rvFold(r.toString()).slice(-24);
    let k=0; while(k<Math.min(want.length,got.length) && want[want.length-1-k]===got[got.length-1-k]) k++;
    if(k>bs){ bs=k; best=ch; }
  });
  return best;
}
function rvGhost(p,scroll){
  document.querySelectorAll('#detail .ghost').forEach(g=>{ g.replaceWith(...g.childNodes); });
  document.querySelectorAll('#detail sup.rawmk.cur').forEach(c=>c.classList.remove('cur'));
  if(!p) return;
  const ch=rvFindChip(p);
  if(!ch){ return; }
  ch.classList.add('cur');
  if(scroll) ch.scrollIntoView({block:'center',behavior:'smooth'});
  const tr=(($('#rvTrecho')||{}).value||p.trecho||'').replace(/\s+/g,' ').trim(); if(!tr) return;
  // procura o trecho no MESMO bloco, na ocorrência mais próxima do marcador
  const blk=ch.closest('.ens-texto,.db-body,.ax-text,.ax-verse,.ax-pre-p')||ch.parentNode;
  const nodes=[]; const tw=document.createTreeWalker(blk,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode.closest('.fn-pop,sup.rawmk,sup.ref')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  let all='', n; while((n=tw.nextNode())){ nodes.push([n,all.length]); all+=n.data; }
  const flatT=all.replace(/\s/g,' '), needle=tr.replace(/\s/g,' ');
  const r0=document.createRange(); r0.setStart(blk,0); r0.setEndBefore(ch); const chPos=r0.toString().length;
  let pos=-1, bd=1e9, i=flatT.indexOf(needle);
  while(i>=0){ const d=Math.min(Math.abs(i+needle.length-chPos),Math.abs(i-chPos)); if(d<bd){bd=d;pos=i;} i=flatT.indexOf(needle,i+1); }
  if(pos<0) return;
  const at=(off)=>{ for(let k=nodes.length-1;k>=0;k--){ if(nodes[k][1]<=off) return [nodes[k][0],off-nodes[k][1]]; } return null; };
  const atEnd=(off)=>{ for(let k=nodes.length-1;k>=0;k--){ if(nodes[k][1]<off) return [nodes[k][0],off-nodes[k][1]]; } return null; };
  const s=at(pos), e=atEnd(pos+needle.length); if(!s||!e) return;
  try{ const r=document.createRange(); r.setStart(s[0],s[1]); r.setEnd(e[0],e[1]);
    const span=document.createElement('span'); span.className='ghost'; span.appendChild(r.extractContents()); r.insertNode(span); }catch(_){ }
}
(function(){
  const btn=document.createElement('button'); btn.id='revBtn'; btn.textContent='📝 Notas pendentes';
  btn.title='Revisar a fila de notas propostas (aprovar / rejeitar)';
  const top=document.getElementById('top'); top.insertBefore(btn, document.getElementById('themeBtn'));
  btn.onclick=async()=>{
    RV.on=!RV.on; btn.classList.toggle('on',RV.on); document.body.classList.toggle('review',RV.on);
    if(RV.on){ try{ await rvLoad(); rvRender(); }catch(e){ $('#review').innerHTML='<div class="rv-msg err">fila indisponível: rode <code>python tools/notes_inventory.py</code></div>'; } }
    else rvGhost(null);
  };
  // clique num *N pendente -> abre a vaga correspondente
  document.addEventListener('click',e=>{
    if(!RV.on) return; const ch=e.target.closest&&e.target.closest('#detail sup.rawmk'); if(!ch) return;
    const blk=ch.closest('.ens-texto,.db-body,.ax-text,.ax-verse,.ax-pre-p,h1,h2,h3,h4,h5')||ch.parentNode;
    const r=document.createRange(); r.setStart(blk,0); r.setEndBefore(ch); const got=rvFold(r.toString()).slice(-24);
    RV.file=''; RV.st='todas';
    const L=rvList(); const k=L.findIndex(p=>p.n===+ch.dataset.rn && rvFold(p.ctx).endsWith(got.slice(-16)));
    if(k>=0){ RV.i=k; rvRender(); }
  });
  document.addEventListener('keydown',e=>{
    if(!RV.on) return;
    const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'');
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); rvApprove(); return; }
    if(typing||e.ctrlKey||e.metaKey||e.altKey) return;
    const k=e.key.toLowerCase();
    if(k==='a'){ e.preventDefault(); rvApprove(); }
    else if(k==='r'){ e.preventDefault(); rvAct('status',{status:'rejeitada'}); }
    else if(k==='d'){ e.preventDefault(); const b=$('#rvDrop'); if(b) b.click(); }
    else if(k==='m'){ e.preventDefault(); rvUseSel(); }
    else if(k==='j'||e.key==='ArrowRight'&&e.shiftKey){ e.preventDefault(); rvStep(1); }
    else if(k==='k'||e.key==='ArrowLeft'&&e.shiftKey){ e.preventDefault(); rvStep(-1); }
  });
})();
// Carrega o livro real (shin-dendo-tebiki.json: raiz 'sections', ensinamentos
// preenchidos). Cai no _tree.json + DEMO se o book ainda nao foi gerado.
// Restaura o nó aberto + a rolagem após um F5 (recarregamento completo perde a variável 'cur').
function nodeFromHash(){ const id=decodeURIComponent(location.hash.slice(1)); return id?flat.find(n=>n.id===id):null; }
window.addEventListener('popstate',()=>{ const a=nodeFromHash(); if(a&&a!==cur) select(a,{noHist:true}); else if(!a) home(); });
window.addEventListener('hashchange',()=>{ const a=nodeFromHash(); if(a&&a!==cur) select(a,{noHist:true}); });
// Página inicial: capítulos e itens (quando não há nada aberto)
function home(){
  cur=null; document.title='Novo Manual de Difusão — 新・伝道の手引き';
  $('#crumb').innerHTML='';
  const cap=c=>`<div style="margin:18px 0 6px;font-weight:700;color:#f0c24b">${esc(c.marcador)} — ${esc(c.title)}</div>`+
    (c.children||[]).map(i=>`<div><a class="xref" style="font-size:15px;white-space:normal" href="#${i.id}">${esc(i.marcador)} · ${esc((i.title||'').replace(/\[\^\d+\]|\*\d{1,2}(?!\d)/g,''))}</a>${i.pagina?` <span style="color:var(--mut);font-size:12px">pág. ${i.pagina}</span>`:''}</div>`).join('');
  $('#detail').innerHTML=`<h1>${esc(TREE.title||'Novo Manual de Difusão')}</h1><div class="meta">${esc(TREE.titleJa||'')} · ${esc(TREE.kickerLabel||'')}</div>
    <div class="hint">Use o índice (☰ no celular) ou a busca para achar um ensinamento. A busca procura no <b>texto inteiro</b> — títulos, ensinamentos, explicações e notas. Cada ensinamento tem um link próprio para compartilhar.</div>
    ${(TREE.children||[]).map(cap).join('')}`;
}
function restoreCur(){
  const h=nodeFromHash(); if(h){ select(h,{noHist:true}); return; }
  let id, sc; try{ id=localStorage.getItem('nav-cur'); sc=+localStorage.getItem('nav-scroll')||0; }catch(_){ }
  if(!id){ home(); return; }
  const a=flat.find(n=>n.id===id); if(!a){ home(); return; }
  select(a,{replace:true});                             // expande a trilha + seleciona + renderiza
  if(sc){ const d=$('#detail'); if(d){ const set=()=>{ d.scrollTop=sc; };   // volta a rolagem; repete pois layout/fontes podem assentar tarde (senão clampa p/ 0)
    requestAnimationFrame(set); setTimeout(set,120); setTimeout(set,300); } }
}
// salva a rolagem do painel (debounce) p/ restaurar no F5
$('#detail').addEventListener('scroll', ()=>{ clearTimeout(window._navScrollT); window._navScrollT=setTimeout(()=>{ try{ localStorage.setItem('nav-scroll', $('#detail').scrollTop); }catch(_){ } }, 200); }, {passive:true});
fetch(STATIC?'book.json':'/_book.json').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(t=>{
  if(t.sections && !t.children) t.children = t.sections;   // raiz do book usa 'sections'
  TREE=t; flat=[]; walk(TREE,null,0); render(); restoreCur();
}).catch(()=>{
  fetch('/_tree.json').then(r=>r.json()).then(t=>{ TREE=t; flat=[]; walk(TREE,null,0);
    const d=flat.find(n=>n.id==='c1.i1.1'); if(d) d.ensinamento=DEMO_ENS; render(); restoreCur(); });
});
// Auto-sync com o editor (aba "/"): ao salvar, o editor bumpa localStorage 'sd-book-rev'.
// O evento 'storage' dispara nas OUTRAS abas → recarrega o livro NO LUGAR (mesmo nó + rolagem), sem F5 nem perder a posição.
window.addEventListener('storage', e=>{
  if(e.key==='sd-book-rev'){ reloadBook(cur && cur.id).then(flashSync); }
});
function flashSync(){
  let el=document.getElementById('syncToast');
  if(!el){ el=document.createElement('div'); el.id='syncToast'; document.body.appendChild(el); }
  el.textContent='✓ atualizado do editor';
  el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1700);
}
</script>
